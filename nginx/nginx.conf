server {
    listen 11732;
    server_name _; # 可改为你的域名或IP
	client_max_body_size 15M; 
    # 前端静态资源（Vite打包后的dist目录）
    location / {
        root /app/dist/; # dist目录的绝对路径
        try_files $uri $uri/ /index.html;
    }

    # 上传文件静态访问（如头像、表白图片）
    location /uploads/ {
        alias /app/uploads/; # uploads目录，将uploads目录映射供图片访问。
    }
	   # 上传文件静态访问（如头像、表白图片）
    location /uploads/avatars/uploads/ {
        alias /app/uploads/; # uploads目录，将uploads目录映射供图片访问。
    }

    # 后端API反向代理
    location /api/ {
        proxy_pass http://app:8080; # 后端服务端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS相关响应头
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Authorization' always;

        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
    }
}